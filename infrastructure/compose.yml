services:
  db:
    image: postgres:17.11-alpine3.24
    container_name: diavoletti-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ../backend
    container_name: diavoletti-backend
    restart: unless-stopped

    env_file:
      - ../.env

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ../backend:/app

    depends_on:
      db:
        condition: service_healthy

    command:
      - python
      - manage.py
      - runserver
      - 0.0.0.0:8000

volumes:
  postgres_data: