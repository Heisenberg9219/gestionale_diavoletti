name: Build and deploy

on:
  # Ogni push su dev pubblica automaticamente l'ambiente di sviluppo.
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente da pubblicare. Seleziona lo stesso ambiente del branch scelto.
        required: true
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

jobs:
  tests:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'dev') ||
      (inputs.environment == 'development' && github.ref_name == 'dev') ||
      (inputs.environment == 'production' && github.ref_name == 'prod')
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}
    concurrency:
      group: deploy-${{ inputs.environment || 'development' }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      DJANGO_DEBUG: ${{ vars.DJANGO_DEBUG }}
      DJANGO_ALLOWED_HOSTS: ${{ vars.DJANGO_ALLOWED_HOSTS }}
      DJANGO_COOKIE_SECURE: ${{ vars.DJANGO_COOKIE_SECURE }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${{ vars.AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${{ secrets.AZURE_DOCUMENT_INTELLIGENCE_KEY }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}

    steps:
      - name: Verifica il branch scelto
        run: |
          echo "Deploy di $GITHUB_REF_NAME su ${{ inputs.environment || 'development' }} ($GITHUB_EVENT_NAME)"

      - name: Configura l'accesso SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Prepara il file .env
        # I valori vengono scritti tra apici singoli (letti alla lettera da
        # Docker Compose) e trasferiti in base64: caratteri come $ ` \ nei
        # secret non vengono più interpretati dalla shell remota.
        run: |
          set -eu
          umask 077
          : > deploy.env
          for name in POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD POSTGRES_HOST POSTGRES_PORT \
                      DJANGO_SECRET_KEY DJANGO_DEBUG DJANGO_ALLOWED_HOSTS DJANGO_COOKIE_SECURE \
                      APP_DOMAIN AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT AZURE_DOCUMENT_INTELLIGENCE_KEY; do
            value="${!name}"
            case "$value" in
              *"'"*) echo "::error::$name contiene un apice singolo: rigenera il valore."; exit 1 ;;
              '$'*) echo "::error::$name non può iniziare con \$: rigenera il valore."; exit 1 ;;
            esac
            if [ "$(printf '%s' "$value" | wc -l)" -ne 0 ]; then
              echo "::error::$name non può contenere a capo."; exit 1
            fi
            printf "%s='%s'\n" "$name" "$value" >> deploy.env
          done
          echo "ENV_B64=$(base64 -w0 deploy.env)" >> "$GITHUB_ENV"
          rm -f deploy.env

      - name: Aggiorna e pubblica sul server
        # Lo script remoto viene caricato come file e poi eseguito: se fosse
        # passato su stdin, comandi come "docker compose exec -T" leggerebbero
        # (e farebbero sparire) il resto dello script, chiudendo il deploy a metà
        # senza errori.
        run: |
          set -eu
          cat > deploy-remote.sh <<'REMOTE'
          set -eu
          exec < /dev/null
          DEPLOY_PATH="$1"; BRANCH="$2"; ENV_B64="$3"
          cd "$DEPLOY_PATH"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          echo "Versione: $(git log --oneline -1)"
          umask 077
          printf '%s' "$ENV_B64" | base64 -d > .env

          COMPOSE="docker compose --env-file .env -f infrastructure/compose.server.yml"

          echo "== 1. Backup prima di toccare il database"
          if [ -n "$($COMPOSE ps -q db 2>/dev/null)" ]; then
            COMPOSE_FILE="$DEPLOY_PATH/infrastructure/compose.server.yml" \
            COMPOSE_ENV_FILE="$DEPLOY_PATH/.env" \
              python3 infrastructure/scripts/backup_postgres.py
          else
            echo "Database non ancora avviato: backup saltato."
          fi

          echo "== 2. Build delle nuove immagini (la versione attuale resta in linea)"
          $COMPOSE build

          echo "== 3. Migrazioni e file statici"
          $COMPOSE up -d --wait db
          $COMPOSE run --rm --no-deps -T backend python manage.py migrate --noinput
          $COMPOSE run --rm --no-deps -T backend python manage.py collectstatic --noinput

          echo "== 4. Avvio della nuova versione"
          $COMPOSE up -d --remove-orphans

          echo "== 5. Verifica"
          if $COMPOSE exec -T backend python manage.py showmigrations --plan | grep -q '\[ \]'; then
            echo "ERRORE: ci sono migrazioni non applicate." >&2
            exit 1
          fi
          $COMPOSE ps
          echo "Deploy completato."
          REMOTE

          SSH="ssh -o PubkeyAuthentication=unbound -o IdentitiesOnly=yes $DEPLOY_USER@$DEPLOY_HOST"
          REMOTE_FILE=$($SSH -n 'mktemp /tmp/diavoletti-deploy.XXXXXX')
          $SSH "cat > '$REMOTE_FILE'" < deploy-remote.sh
          rm -f deploy-remote.sh
          $SSH -n "bash '$REMOTE_FILE' '$DEPLOY_PATH' '$GITHUB_REF_NAME' '$ENV_B64'; status=\$?; rm -f '$REMOTE_FILE'; exit \$status"
