name: Tests

on:
  push:
    branches: [main, prod]  # su dev i test partono dal workflow di deploy
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: diavoletti_test
          POSTGRES_USER: diavoletti
          POSTGRES_PASSWORD: diavoletti
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diavoletti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: diavoletti_test
      POSTGRES_USER: diavoletti
      POSTGRES_PASSWORD: diavoletti
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installa le dipendenze
        run: pip install -r requirements.txt
      - name: Controlli Django
        run: python manage.py check
      - name: Migrazioni allineate ai modelli
        run: python manage.py makemigrations --check --dry-run
      - name: Test
        run: python manage.py test --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
